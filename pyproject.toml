[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperflow"
version = "0.1.0"
description = "Turn paper-alert emails into a deduplicated, metadata-rich paper database"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
    "requests-cache>=1.2",
    "rapidfuzz>=3.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pypdf>=4.0",
]

[project.optional-dependencies]
specter2 = ["torch>=2.1", "transformers>=4.40", "adapters>=1.0"]
st = ["sentence-transformers>=3.0"]
llm = ["anthropic>=0.70"]
tts = ["kokoro>=0.9.4", "soundfile>=0.12"]

[project.scripts]
paperflow = "paperflow.cli:main"

[tool.setuptools]
packages = ["paperflow", "paperflow.parsers"]
